# Kubelet TLS drop-in, merged via --config-dir.
mode: 0644
path: "/etc/openshift/kubelet.conf.d/99-tls.conf"
contents:
  inline: |
    apiVersion: kubelet.config.k8s.io/v1beta1
    kind: KubeletConfiguration
    tlsMinVersion: {{.TLSMinVersion}}
    tlsCipherSuites:
      {{- range .TLSCipherSuites }}
    - {{ . }}
      {{- end }}
