name: firstboot-pivot-skip-pull.service
enabled: false
contents: |
  [Unit]
  Description=Firstboot Pivot Skip - Pull Node Image
  Wants=network.target NetworkManager.service NetworkManager-wait-online.service
  After=network.target NetworkManager.service NetworkManager-wait-online.service
  OnFailure=firstboot-pivot-skip-fallback.service

  [Service]
  Type=oneshot
  RemainAfterExit=yes
  ExecStartPre=chcon --reference=/usr/bin/ostree /usr/local/bin/firstboot-pivot-skip-pull.sh
  ExecStart=/usr/local/bin/firstboot-pivot-skip-pull.sh
  {{if .Proxy -}}
  EnvironmentFile=/etc/mco/proxy.env
  {{end -}}
