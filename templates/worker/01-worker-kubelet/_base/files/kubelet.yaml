mode: 0644
path: "/etc/kubernetes/kubelet.conf"
contents:
  inline: |
    kind: KubeletConfiguration
    apiVersion: kubelet.config.k8s.io/v1beta1
    authentication:
      x509:
        clientCAFile: /etc/kubernetes/kubelet-ca.crt
      anonymous:
        enabled: false
    cgroupDriver: systemd
    cgroupRoot: /
    clusterDNS:
      - {{.ClusterDNSIP}}
    clusterDomain: cluster.local
    containerLogMaxSize: 50Mi
    enableSystemLogQuery: true
    failSwapOn: false
    maxPods: 250
    kubeAPIQPS: 50
    kubeAPIBurst: 100
    podPidsLimit: 4096
    protectKernelDefaults: true
    rotateCertificates: true
    serializeImagePulls: false
    staticPodPath: /etc/kubernetes/manifests
    memorySwap:
      swapBehavior: NoSwap
    systemCgroups: /system.slice
    systemReservedCgroup: /system.slice
    enforceNodeAllocatable:
      - pods
      - system-reserved-compressible
    nodeStatusUpdateFrequency: 10s
    nodeStatusReportFrequency: 5m
    serverTLSBootstrap: true
    tlsMinVersion: {{.TLSMinVersion}}
    tlsCipherSuites:
      {{- range .TLSCipherSuites }}
        - {{ . }}
      {{- end }}
    # DO NOT MERGE -- temporary FIPS probe, revert before merging.
    #
    # Replaces the templated block so exactly one tlsCurvePreferences key is
    # emitted; two keys would make kubelet fail to parse the file, which would
    # look like a curve rejection and give a false positive.
    #
    # Worker only, so the control plane stays up and must-gather still works.
    # 4588 and 29 are absent from every FIPS curve allowlist, 23 is on all of
    # them. If the kubelet skips non-approved curves it negotiates P-256 and the
    # workers go Ready; if it hard-rejects them the workers stay NotReady and the
    # reason should be in the worker kubelet journal in the gather artifacts.
    tlsCurvePreferences:
      - 4588   # X25519MLKEM768
      - 29     # X25519
      - 23     # P-256
