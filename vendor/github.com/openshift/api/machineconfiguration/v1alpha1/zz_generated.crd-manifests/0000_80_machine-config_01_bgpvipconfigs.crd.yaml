apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    api-approved.openshift.io: https://github.com/openshift/api/pull/2972
    api.openshift.io/merged-by-featuregates: "true"
    include.release.openshift.io/ibm-cloud-managed: "true"
    include.release.openshift.io/self-managed-high-availability: "true"
    release.openshift.io/feature-set: CustomNoUpgrade,DevPreviewNoUpgrade
  labels:
    openshift.io/operator-managed: ""
  name: bgpvipconfigs.machineconfiguration.openshift.io
spec:
  group: machineconfiguration.openshift.io
  names:
    kind: BGPVIPConfig
    listKind: BGPVIPConfigList
    plural: bgpvipconfigs
    singular: bgpvipconfig
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          BGPVIPConfig carries the BGP peering configuration for BGP-based VIP
          management (enhancement openshift/enhancements#1982). It is a singleton
          named "cluster", generated by the installer from
          platform.baremetal.bgpVIPConfig in the install-config, and may be edited
          day-2 to reconfigure peering. The configuration is rendered into
          node-level BGP configuration by its consumers, the
          machine-config-operator and the cluster-network-operator, which report
          their progress in status.

          Compatibility level 4: No compatibility is provided, the API can change at any point for any reason. These capabilities should not be used by applications needing long term support.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the desired BGP VIP peering configuration.
            properties:
              communities:
                description: |-
                  communities are BGP community strings attached to the VIP
                  advertisements: "n:n" classic communities (RFC 1997) where each
                  segment is a 16-bit value of at least 0 and not exceeding 65535, or
                  "n:n:n" large communities (RFC 8092) where each segment is a 32-bit
                  value of at least 0 and not exceeding 4294967295. When omitted, no
                  communities are attached. Entries are unique; when set, must have at
                  least 1 entry and must not exceed 8 entries.
                items:
                  description: |-
                    BGPCommunity is a BGP community string: colon-separated decimal
                    numbers without leading zeros - "n:n" for a classic community
                    (RFC 1997, 16-bit segments of at least 0 and not exceeding 65535) or
                    "n:n:n" for a large community (RFC 8092, 32-bit segments of at least 0
                    and not exceeding 4294967295). Must be at least 3 characters in length
                    and must not exceed 32 characters.
                  maxLength: 32
                  minLength: 3
                  type: string
                  x-kubernetes-validations:
                  - message: 'must be a classic (n:n) or large (n:n:n) BGP community:
                      colon-separated decimal numbers without leading zeros'
                    rule: self.matches('^(0|[1-9][0-9]*)(:(0|[1-9][0-9]*)){1,2}$')
                  - message: classic community (n:n) segments must be between 0 and
                      65535; large community (n:n:n) segments must be between 0 and
                      4294967295
                    rule: '!self.matches(''^(0|[1-9][0-9]*)(:(0|[1-9][0-9]*)){1,2}$'')
                      || (self.split('':'').size() == 2 ? self.split('':'').all(s,
                      s.size() <= 5 && int(s) <= 65535) : self.split('':'').all(s,
                      s.size() <= 10 && int(s) <= 4294967295))'
                maxItems: 8
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              defaultPeers:
                description: |-
                  defaultPeers are the BGP peers every node establishes sessions with,
                  unless the node is named in hostOverrides. Must have at least 1 entry
                  and must not exceed 16 entries, unique by peerAddress.
                items:
                  description: BGPVIPPeer describes one BGP peer.
                  properties:
                    failureDetection:
                      description: |-
                        failureDetection determines how a failed peer is detected. When set
                        to "BFD", a BFD session is established with the peer and BGP reacts
                        to BFD failure detection. When set to "HoldTimer", failure detection
                        relies on the BGP hold timer alone. When omitted, failure detection
                        relies on the BGP hold timer.
                      enum:
                      - BFD
                      - HoldTimer
                      type: string
                    holdTimeSeconds:
                      description: |-
                        holdTimeSeconds is the BGP hold time in seconds; must be at least 3
                        (the RFC 4271 minimum for a non-zero hold time) and must not exceed
                        65535. When omitted, no hold time is configured and the FRR default
                        (180 seconds) applies.
                        When both holdTimeSeconds and keepaliveTimeSeconds are set,
                        holdTimeSeconds must be at least 3 times keepaliveTimeSeconds.
                      format: int32
                      maximum: 65535
                      minimum: 3
                      type: integer
                    keepaliveTimeSeconds:
                      description: |-
                        keepaliveTimeSeconds is the BGP keepalive interval in seconds; must
                        be at least 1 and must not exceed 65535. When omitted, no keepalive
                        interval is configured and the FRR default (60 seconds) applies. When both
                        holdTimeSeconds and keepaliveTimeSeconds are set, holdTimeSeconds
                        must be at least 3 times keepaliveTimeSeconds.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    passwordSecret:
                      description: |-
                        passwordSecret references the Secret carrying the TCP MD5 password
                        (RFC 2385) for the session. The Secret must be of type
                        kubernetes.io/basic-auth, live in the openshift-config namespace, and
                        carry the password in its "password" key (at most 80 bytes, the
                        kernel's TCP MD5 limit). The Secret type, key, and size requirements
                        are not validated by the API server; the consumers validate them when
                        resolving the reference and must never surface the Secret contents in
                        status, events, or logs. Passwords are never stored in this API. When
                        omitted, the session is unauthenticated.
                      properties:
                        name:
                          description: |-
                            name is the metadata.name of the referenced Secret in the
                            openshift-config namespace. Must be a non-empty RFC 1123 subdomain of
                            at most 253 characters, matching what Kubernetes accepts as a Secret
                            name.
                          maxLength: 253
                          minLength: 1
                          type: string
                          x-kubernetes-validations:
                          - message: name must be a lowercase RFC 1123 subdomain
                            rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                      required:
                      - name
                      type: object
                    peerASN:
                      description: |-
                        peerASN is the autonomous system number of the peer. Must be at
                        least 1 and must not exceed 4294967295.
                      format: int64
                      maximum: 4294967295
                      minimum: 1
                      type: integer
                    peerAddress:
                      description: |-
                        peerAddress is the IP address of the BGP peer (IPv4 or IPv6) in
                        canonical form (lowercase, no leading zeros, IPv6 zero-compressed);
                        must be at least 2 characters in length and must not exceed 45
                        characters. The session's address family follows the address family
                        of this value. Canonical form is required so that two
                        spellings of one address cannot form duplicate peers.
                      maxLength: 45
                      minLength: 2
                      type: string
                      x-kubernetes-validations:
                      - message: peerAddress must be a valid IP address in canonical
                          form
                        rule: isIP(self) && ip.isCanonical(self)
                    peerReachability:
                      description: |-
                        peerReachability describes how the peer is reached. When set to
                        "MultiHop", the session may be established with a peer several
                        router hops away. When set to "DirectlyConnected", the peer must be
                        on a directly connected network. When omitted, the peer must be
                        directly connected.
                      enum:
                      - DirectlyConnected
                      - MultiHop
                      type: string
                    port:
                      description: |-
                        port is the TCP port of the BGP session; must be at least 1 and must
                        not exceed 65535. When omitted, port 179 is used.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                  required:
                  - peerASN
                  - peerAddress
                  type: object
                  x-kubernetes-validations:
                  - message: holdTimeSeconds must be at least 3 times keepaliveTimeSeconds
                    rule: '!(has(self.holdTimeSeconds) && has(self.keepaliveTimeSeconds))
                      || self.holdTimeSeconds >= 3 * self.keepaliveTimeSeconds'
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - peerAddress
                x-kubernetes-list-type: map
              hostOverrides:
                description: |-
                  hostOverrides replaces (does not merge with) defaultPeers for the
                  named nodes. Only the per-node peer file rendered by the
                  machine-config-operator consumes overrides; the cluster-wide session
                  configuration rendered by the cluster-network-operator uses
                  defaultPeers. When omitted, all nodes use defaultPeers; when set, must
                  have at least 1 entry and must not exceed 256 entries, unique by
                  hostname.
                items:
                  description: BGPVIPHostPeers is a per-node replacement peer list.
                  properties:
                    hostname:
                      description: |-
                        hostname of the node this override applies to, as a non-empty RFC
                        1123 subdomain of at most 253 characters with dot-separated labels of
                        at most 63 characters each. It is compared verbatim against
                        the hostname the node resolves for itself (as rendered into the
                        per-node peer file), so a short name and its fully qualified form are
                        distinct entries and only the exact match applies.
                      maxLength: 253
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: hostname must be an RFC 1123 subdomain with labels
                          of at most 63 characters
                        rule: self.matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$')
                    peers:
                      description: |-
                        peers replaces defaultPeers for this node. Must have at least 1 entry
                        and must not exceed 16 entries, unique by peerAddress.
                      items:
                        description: BGPVIPPeer describes one BGP peer.
                        properties:
                          failureDetection:
                            description: |-
                              failureDetection determines how a failed peer is detected. When set
                              to "BFD", a BFD session is established with the peer and BGP reacts
                              to BFD failure detection. When set to "HoldTimer", failure detection
                              relies on the BGP hold timer alone. When omitted, failure detection
                              relies on the BGP hold timer.
                            enum:
                            - BFD
                            - HoldTimer
                            type: string
                          holdTimeSeconds:
                            description: |-
                              holdTimeSeconds is the BGP hold time in seconds; must be at least 3
                              (the RFC 4271 minimum for a non-zero hold time) and must not exceed
                              65535. When omitted, no hold time is configured and the FRR default
                              (180 seconds) applies.
                              When both holdTimeSeconds and keepaliveTimeSeconds are set,
                              holdTimeSeconds must be at least 3 times keepaliveTimeSeconds.
                            format: int32
                            maximum: 65535
                            minimum: 3
                            type: integer
                          keepaliveTimeSeconds:
                            description: |-
                              keepaliveTimeSeconds is the BGP keepalive interval in seconds; must
                              be at least 1 and must not exceed 65535. When omitted, no keepalive
                              interval is configured and the FRR default (60 seconds) applies. When both
                              holdTimeSeconds and keepaliveTimeSeconds are set, holdTimeSeconds
                              must be at least 3 times keepaliveTimeSeconds.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                          passwordSecret:
                            description: |-
                              passwordSecret references the Secret carrying the TCP MD5 password
                              (RFC 2385) for the session. The Secret must be of type
                              kubernetes.io/basic-auth, live in the openshift-config namespace, and
                              carry the password in its "password" key (at most 80 bytes, the
                              kernel's TCP MD5 limit). The Secret type, key, and size requirements
                              are not validated by the API server; the consumers validate them when
                              resolving the reference and must never surface the Secret contents in
                              status, events, or logs. Passwords are never stored in this API. When
                              omitted, the session is unauthenticated.
                            properties:
                              name:
                                description: |-
                                  name is the metadata.name of the referenced Secret in the
                                  openshift-config namespace. Must be a non-empty RFC 1123 subdomain of
                                  at most 253 characters, matching what Kubernetes accepts as a Secret
                                  name.
                                maxLength: 253
                                minLength: 1
                                type: string
                                x-kubernetes-validations:
                                - message: name must be a lowercase RFC 1123 subdomain
                                  rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                            required:
                            - name
                            type: object
                          peerASN:
                            description: |-
                              peerASN is the autonomous system number of the peer. Must be at
                              least 1 and must not exceed 4294967295.
                            format: int64
                            maximum: 4294967295
                            minimum: 1
                            type: integer
                          peerAddress:
                            description: |-
                              peerAddress is the IP address of the BGP peer (IPv4 or IPv6) in
                              canonical form (lowercase, no leading zeros, IPv6 zero-compressed);
                              must be at least 2 characters in length and must not exceed 45
                              characters. The session's address family follows the address family
                              of this value. Canonical form is required so that two
                              spellings of one address cannot form duplicate peers.
                            maxLength: 45
                            minLength: 2
                            type: string
                            x-kubernetes-validations:
                            - message: peerAddress must be a valid IP address in canonical
                                form
                              rule: isIP(self) && ip.isCanonical(self)
                          peerReachability:
                            description: |-
                              peerReachability describes how the peer is reached. When set to
                              "MultiHop", the session may be established with a peer several
                              router hops away. When set to "DirectlyConnected", the peer must be
                              on a directly connected network. When omitted, the peer must be
                              directly connected.
                            enum:
                            - DirectlyConnected
                            - MultiHop
                            type: string
                          port:
                            description: |-
                              port is the TCP port of the BGP session; must be at least 1 and must
                              not exceed 65535. When omitted, port 179 is used.
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                        required:
                        - peerASN
                        - peerAddress
                        type: object
                        x-kubernetes-validations:
                        - message: holdTimeSeconds must be at least 3 times keepaliveTimeSeconds
                          rule: '!(has(self.holdTimeSeconds) && has(self.keepaliveTimeSeconds))
                            || self.holdTimeSeconds >= 3 * self.keepaliveTimeSeconds'
                      maxItems: 16
                      minItems: 1
                      type: array
                      x-kubernetes-list-map-keys:
                      - peerAddress
                      x-kubernetes-list-type: map
                  required:
                  - hostname
                  - peers
                  type: object
                maxItems: 256
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - hostname
                x-kubernetes-list-type: map
              localASN:
                description: |-
                  localASN is the BGP autonomous system number (ASN) the cluster's BGP
                  speakers present to the configured peers. Use the ASN your network
                  administrator assigned to the cluster - the peer routers must expect
                  it or no session establishes; private-range ASNs (e.g. 64512-65534)
                  are typical for datacenter fabrics. Must be at least 1 and must not
                  exceed 4294967295.
                format: int64
                maximum: 4294967295
                minimum: 1
                type: integer
            required:
            - defaultPeers
            - localASN
            type: object
          status:
            description: status reports the consumers' progress applying the configuration.
            minProperties: 1
            properties:
              conditions:
                description: |-
                  conditions reports the state of processing the configuration; when
                  set, must have at least 1 entry and must not exceed 8 entries. Known
                  condition types are "Rendered" (the machine-config-operator has
                  rendered the per-node peer configuration) and "SessionsConfigured"
                  (the cluster-network-operator has rendered the FRR session
                  configuration for application). SessionsConfigured does not assert
                  that the generated FRRConfiguration was accepted by the frr-k8s
                  admission webhook or applied on the nodes. Each condition's
                  observedGeneration reports the generation of the spec most recently
                  processed by the operator that writes it.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - metadata
        - spec
        type: object
        x-kubernetes-validations:
        - message: bgpvipconfig is a singleton, .metadata.name must be 'cluster'
          rule: self.metadata.name == 'cluster'
    served: true
    storage: true
    subresources:
      status: {}
